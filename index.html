<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 视频画廊</title>
  <meta name="description" content="Roger 的 AI 视频画廊：团子系列、微缩世界和动物。点开封面即可播放。">
  <meta name="theme-color" content="#141210">
  <meta property="og:title" content="AI 视频画廊">
  <meta property="og:description" content="团子系列、微缩世界和动物。点开封面即可播放。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://iamyours.github.io/ai-video-gallery/">
  <meta property="og:image" content="https://iamyours.github.io/ai-video-gallery/covers/dango-ep1-full.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#catalog">跳到影片</a>
  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#2a241f"/>
          <ellipse cx="32" cy="36" rx="16" ry="20" fill="#f3e6d4"/>
          <circle cx="26" cy="34" r="2.1" fill="#1a1714"/>
          <circle cx="38" cy="34" r="2.1" fill="#1a1714"/>
          <path d="M27 42.5c1.6 2 4 3 5 3s3.4-1 5-3" fill="none" stroke="#1a1714" stroke-width="1.6" stroke-linecap="round"/>
          <ellipse cx="22" cy="39" rx="3.2" ry="1.8" fill="#f0a8ad"/>
          <ellipse cx="42" cy="39" rx="3.2" ry="1.8" fill="#f0a8ad"/>
        </svg>
        <div>
          <p class="eyebrow">短片收藏</p>
          <h1>AI 视频画廊</h1>
        </div>
      </div>
      <p class="lede">点开封面，播放的是本站上的 mp4。提示词只展示有记录的原文，可以一键复制。<span id="count"></span></p>
    </div>
  </header>
  <div class="filter-bar">
    <div class="wrap">
      <nav id="filters" aria-label="分类"></nav>
    </div>
  </div>
  <main class="wrap" id="catalog-wrap">
    <p id="status" class="status" role="status"></p>
    <div id="catalog"></div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Roger 的静态画廊。新增一条片子，改 <a href="data/manifest.json">data/manifest.json</a>，并放上视频和封面。</p>
    </div>
  </footer>

  <dialog id="player" aria-labelledby="player-title">
    <div class="player-sheet">
      <div class="stage">
        <button type="button" id="player-close" class="close-btn">关闭</button>
        <video id="player-video" controls playsinline preload="metadata"></video>
        <div id="playlist-bar" class="playlist-bar" hidden></div>
      </div>
      <div class="player-body">
        <p id="player-kicker" class="kicker"></p>
        <h2 id="player-title"></h2>
        <p id="player-subtitle" class="subtitle"></p>
        <dl id="player-meta" class="meta"></dl>
        <div id="player-actions" class="actions"></div>
        <p id="player-error" class="error" hidden></p>
        <section id="player-prompt" class="prompt"></section>
      </div>
    </div>
  </dialog>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <noscript>
    <p class="noscript wrap">这个画廊需要 JavaScript 才能列出视频。你仍然可以打开 <a href="data/manifest.json">数据文件</a>。</p>
  </noscript>
  <script src="js/app.js"></script>
</body>
</html>
